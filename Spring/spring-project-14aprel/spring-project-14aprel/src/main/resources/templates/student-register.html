<html xmlns:th="http://www.thymeleaf.org" lang="az">
<head>
    <meta charset="UTF-8">
    <title>Tələbə Qeydiyyatı</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5">

    <div class="row">

        <div class="col-md-4">
            <div class="card card-body shadow-sm">
                <h4 class="card-title mb-4">Yeni Tələbə Qeydiyyatı</h4>
                
                <form th:action="@{/add-student}" th:object="${newStudent}" method="POST">
                    <div class="mb-3">
                        <label class="form-label">Ad:</label>
                        <input type="text" th:field="*{name}" class="form-control" required/>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Soyad:</label>
                        <input type="text" th:field="*{surname}" class="form-control" required/>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Email:</label>
                        <input type="email" th:field="*{email}" class="form-control" required/>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Əlavə et</button>
                </form>
            </div>
        </div>


        <div class="col-md-8">
            <h4 class="mb-4">Qeydiyyatdan Keçmiş Tələbələr</h4>
            <table class="table table-striped table-bordered shadow-sm">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Ad</th>
                        <th>Soyad</th>
                        <th>Email</th>
                    </tr>
                </thead>
                <tbody>

                    <tr th:each="st : ${students}">
                        <td th:text="${st.id}">1</td>
                        <td th:text="${st.name}">Ad</td>
                        <td th:text="${st.surname}">Soyad</td>
                        <td th:text="${st.email}">Email</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</body>
</html>
